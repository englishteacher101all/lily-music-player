<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:10px;font-family:Arial,sans-serif;background:transparent;color:#334b68}.player{max-width:430px;margin:auto;padding:16px;border-radius:22px;background:#fff0f6;border:2px solid #f9c6da;box-shadow:0 4px 12px #e7a3bb22}.top{display:flex;align-items:center;gap:12px}.note{background:#ffdaea;padding:12px;border-radius:50%;font-size:25px}.name{flex:1}.name b{display:block;font-size:16px}.name small{font-size:12px;color:#687a8e}.controls{display:flex;align-items:center;gap:10px;margin-top:12px}button{background:#f56e98;color:white;border:0;border-radius:24px;padding:10px 18px;font-weight:700;cursor:pointer}input{width:100%;accent-color:#ef729a}#status{font-size:11px;color:#9a516b;margin-top:9px;min-height:15px}</style></head><body><div class="player"><div class="top"><span class="note">🎵</span><div class="name"><b>Lily's Happy Music</b><small>Let's learn together! 🐰</small></div></div><div class="controls"><button id="toggle">▶ Play</button><span aria-label="Volume">🔊</span><input aria-label="Volume" id="volume" type="range" min="0" max="1" step="0.05" value="0.4"></div><div id="status">Press Play to start the music.</div><audio id="audio" preload="none" loop src="REPLACE_WITH_PUBLIC_DIRECT_MP3_URL"></audio></div><script>const a=document.getElementById('audio'),b=document.getElementById('toggle'),s=document.getElementById('status');a.volume=.4;document.getElementById('volume').oninput=e=>a.volume=Number(e.target.value);b.onclick=async()=>{if(a.paused){try{await a.play()}catch(e){s.textContent='Audio unavailable. Check the direct MP3 URL and sharing permissions.'}}else a.pause()};a.onplay=()=>{b.textContent='⏸ Pause';s.textContent='Music is playing 🎶'};a.onpause=()=>{b.textContent='▶ Play';s.textContent='Music paused.'};a.onerror=()=>s.textContent='Cannot load MP3. A public direct audio URL is required.';</script></body></html>
